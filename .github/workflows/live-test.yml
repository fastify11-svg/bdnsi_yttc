name: Live Admin Login Test

on:
  push:
    paths:
      - '.github/workflows/live-test.yml'
  workflow_dispatch:

jobs:
  playwright-login-test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Run Login Test Script
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            try {
              console.log('Navigating to https://nenobet.live/admin/login...');
              await page.goto('https://nenobet.live/admin/login');
              
              console.log('Filling in credentials...');
              await page.fill('#email', 'admin@gmail.com');
              await page.fill('#password', '12345678');
              
              console.log('Submitting login form...');
              await Promise.all([
                page.waitForNavigation({ waitUntil: 'networkidle' }),
                page.click('button[type=\"submit\"]')
              ]);
              
              const currentUrl = page.url();
              console.log('Current URL after login: ' + currentUrl);
              
              if (currentUrl.includes('/admin')) {
                console.log('✅ Login successful! Reached admin dashboard.');
              } else {
                throw new Error('Did not redirect to admin dashboard. Still on: ' + currentUrl);
              }
            } catch (err) {
              console.error('❌ Login test failed:', err.message);
              process.exit(1);
            } finally {
              await browser.close();
            }
          })();
          "
