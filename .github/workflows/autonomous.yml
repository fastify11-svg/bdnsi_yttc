name: Autonomous CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    name: Autonomous Lifecycle
    runs-on: ubuntu-latest

    steps:
      # ─── 1. CHECKOUT ─────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ─── 2. PHP SETUP ────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, sqlite3, gd, zip
          coverage: none

      # ─── 3. ENVIRONMENT SETUP ────────────────────────────────────────────
      - name: Setup Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=/home/runner/work/bdnsi_yttc/bdnsi_yttc/database/database.sqlite|' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          echo "APP_URL=http://127.0.0.1:8000" >> .env

      # ─── 4. COMPOSER ─────────────────────────────────────────────────────
      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate App Key
        run: php artisan key:generate

      # ─── 5. DATABASE ─────────────────────────────────────────────────────
      - name: Run Database Migrations & Seeding
        run: php artisan migrate:fresh --seed --force -vvv > setup.log 2>&1 || (cat setup.log && exit 1)

      # ─── 6. NODE.JS & NPM ────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Note: using Node 22 (npm 10.x) which requires --legacy-peer-deps
          # because @inertiajs/inertia-react@0.8.1 declares react ^16-18 but we use react 19
          cache: 'npm'

      - name: Install Build Tools (for native modules)
        run: |
          # Ensure python3/build-essential exist for any native packages
          sudo apt-get install -y python3 python3-pip 2>/dev/null || true
          echo "node $(node --version), npm $(npm --version)"

      - name: Install NPM Dependencies
        run: |
          # --legacy-peer-deps: fixes @inertiajs/inertia-react@0.8.1 requiring react ^16-18 (we have react 19)
          # --ignore-scripts: skips cpu-features native C++ compilation (ssh2 optional dep, not needed in CI)
          npm install --legacy-peer-deps --ignore-scripts

      # ─── 7. BUILD FRONTEND ───────────────────────────────────────────────
      - name: Compile Frontend Assets
        run: npm run build
        env:
          NODE_ENV: production

      # ─── 8. PLAYWRIGHT TESTS ─────────────────────────────────────────────
      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Laravel Server
        run: php artisan serve --host=127.0.0.1 --port=8000 > /dev/null 2>&1 &

      - name: Wait for Server to be Ready
        run: wait-on http://127.0.0.1:8000 -t 30000

      - name: Run Playwright Tests
        run: |
          # Run only safe local tests - exclude live-server-only and images-check specs
          # Note: --ignore is not a valid playwright flag; use explicit file pattern instead
          npx playwright test \
            tests/e2e/admin.spec.js \
            tests/e2e/auth.spec.js \
            tests/e2e/document-templates.spec.js \
            tests/e2e/document_templates.spec.js \
            tests/e2e/frontend.spec.js \
            tests/e2e/frontend-connectivity.spec.js \
            tests/e2e/student-enrollment.spec.js \
            tests/e2e/student-payload.spec.js \
            tests/e2e/team-performance.spec.js \
            tests/e2e/youtube-video-access.spec.js \
            > playwright-output.log 2>&1 || (cat playwright-output.log && exit 1)
        env:
          APP_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: '12345678'
          CENTER_EMAIL: center@gmail.com
          CENTER_PASSWORD: '12345678'

      # ─── 9. DEPLOY (SSH to Hostinger) ────────────────────────────────────
      - name: Deploy to Live Server via SSH
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          echo "=== Deploying to Hostinger Live Server ==="
          if [ -z "$SSH_HOST" ]; then
            echo "WARNING: SSH_HOST secret not set. Running node auto_deploy.mjs instead..."
            # Ensure ssh2 module works by allowing native build
            npm rebuild ssh2 2>/dev/null || true
            node auto_deploy.mjs && echo "SSH deployment complete." || echo "SSH deployment failed (non-blocking)."
          else
            # Direct SSH deployment using sshpass + git pull
            sudo apt-get install -y sshpass
            sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
              cd /home/u881397359/domains/nenobet.live/public_html &&
              git fetch origin main &&
              git reset --hard origin/main &&
              composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs &&
              php artisan config:cache &&
              php artisan route:cache &&
              php artisan view:cache &&
              php artisan migrate --force &&
              echo DEPLOYMENT_COMPLETE
            "
            echo "Live server deployment triggered."
          fi

      # ─── 10. ARTIFACTS ON FAILURE ────────────────────────────────────────
      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_number }}
          path: |
            playwright-output.log
            setup.log
          retention-days: 3
