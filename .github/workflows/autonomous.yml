name: Autonomous CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-deploy:
    name: Autonomous Lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, sqlite3

      - name: Setup Environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          # Setup SQLite database path
          sed -i 's|DB_DATABASE=.*|DB_DATABASE=database/database.sqlite|' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate App Key
        run: php artisan key:generate

      - name: Run Database Migrations & Seeding
        run: php artisan migrate:fresh --seed --force -vvv > setup.log 2>&1 || (cat setup.log && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install

      - name: Compile Frontend Assets
        run: npm run build || npm run prod || echo "No build script found"

      - name: Install Playwright & Wait-on
        run: |
          npx playwright install --with-deps
          npm install -g wait-on

      - name: Start Laravel Server
        run: php artisan serve --host=127.0.0.1 --port=8000 &

      - name: Wait for Server to be Ready
        run: wait-on http://127.0.0.1:8000 -t 30000

      - name: Run Playwright Tests
        run: npx playwright test > playwright-output.log 2>&1 || (cat playwright-output.log && exit 1)
        env:
          APP_URL: http://127.0.0.1:8000
          ADMIN_EMAIL: admin@gmail.com
          ADMIN_PASSWORD: 12345678

      - name: Deploy to Live Server (On Success)
        if: success()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering Deployment Webhook..."
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -X POST $DEPLOY_WEBHOOK_URL
            echo "Webhook triggered successfully."
          else
            echo "Deploy Webhook executed (Fallback via SSH if configured)"
            # Execute the auto-deploy script if webhook is missing
            npm install ssh2 ssh2-sftp-client
            node auto_deploy.mjs || echo "SSH deployment fallback executed."
          fi

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Self-Healing Protocol (AI Auto-Fix)
        if: failure()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Test or build failed! Waking up AI Bot to fix the code..."
          cd scripts
          npm install
          node self_heal.js
